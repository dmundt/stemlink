name: Local Extension Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vscode-version: ["1.90.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run format:check
      - run: xvfb-run -a npm run test:coverage
        if: runner.os == 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
      - run: npm run test:coverage
        if: runner.os != 'Linux'
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
      - run: npm run build
      - run: xvfb-run -a npm run benchmark:integration
        if: matrix.os == 'ubuntu-latest' && matrix.vscode-version == 'stable'
        env:
          VSCODE_TEST_VERSION: stable
      - run: npm run package
        if: matrix.os == 'ubuntu-latest' && matrix.vscode-version == 'stable' && !github.event.release.prerelease
      - run: npm run package -- --pre-release
        if: matrix.os == 'ubuntu-latest' && matrix.vscode-version == 'stable' && github.event.release.prerelease
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.vscode-version == 'stable'
        with:
          name: stemlink-package
          path: "*.vsix"
          if-no-files-found: error
